<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Please Stand By broadcast test pattern">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" rx="28" ry="28" fill="url(#vignette)"/>
  <rect x="12" y="12" width="776" height="576" rx="22" ry="22" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="24" y="24" width="752" height="552" rx="18" ry="18" fill="url(#grid)"/>

  <g stroke="#d8d8d8" stroke-width="1" fill="none" filter="url(#glow)">
    <g transform="translate(90, 80)">
      <circle cx="0" cy="0" r="42"/>
      <circle cx="0" cy="0" r="28" stroke-opacity="0.6"/>
      <line x1="-42" y1="0" x2="42" y2="0"/><line x1="0" y1="-42" x2="0" y2="42"/>
      <text x="0" y="-52" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="9">30</text>
      <text x="52" y="4" fill="#aaa" font-family="Arial, sans-serif" font-size="9">50</text>
    </g>
    <g transform="translate(710, 80)">
      <circle cx="0" cy="0" r="42"/>
      <circle cx="0" cy="0" r="28" stroke-opacity="0.6"/>
      <line x1="-42" y1="0" x2="42" y2="0"/><line x1="0" y1="-42" x2="0" y2="42"/>
      <text x="0" y="-52" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="9">30</text>
      <text x="-58" y="4" text-anchor="end" fill="#aaa" font-family="Arial, sans-serif" font-size="9">50</text>
    </g>
    <g transform="translate(90, 520)">
      <circle cx="0" cy="0" r="42"/>
      <circle cx="0" cy="0" r="28" stroke-opacity="0.6"/>
      <line x1="-42" y1="0" x2="42" y2="0"/><line x1="0" y1="-42" x2="0" y2="42"/>
      <text x="0" y="58" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="9">325</text>
    </g>
    <g transform="translate(710, 520)">
      <circle cx="0" cy="0" r="42"/>
      <circle cx="0" cy="0" r="28" stroke-opacity="0.6"/>
      <line x1="-42" y1="0" x2="42" y2="0"/><line x1="0" y1="-42" x2="0" y2="42"/>
      <text x="0" y="58" text-anchor="middle" fill="#aaa" font-family="Arial, sans-serif" font-size="9">527</text>
    </g>
  </g>

  <g transform="translate(400, 300)" stroke="#e8e8e8" stroke-width="1" fill="none" filter="url(#glow)">
    <circle cx="0" cy="0" r="200" stroke-opacity="0.9"/>
    <circle cx="0" cy="0" r="160" stroke-opacity="0.7"/>
    <circle cx="0" cy="0" r="120" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="80" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="40" stroke-opacity="0.4"/>
    <g stroke-opacity="0.55">
      <line x1="0" y1="-200" x2="0" y2="-80"/>
      <line x1="-30" y1="-195" x2="-12" y2="-85"/>
      <line x1="30" y1="-195" x2="12" y2="-85"/>
      <line x1="-58" y1="-185" x2="-24" y2="-92"/>
      <line x1="58" y1="-185" x2="24" y2="-92"/>
      <line x1="-85" y1="-170" x2="-35" y2="-100"/>
      <line x1="85" y1="-170" x2="35" y2="-100"/>
      <line x1="-110" y1="-150" x2="-45" y2="-110"/>
      <line x1="110" y1="-150" x2="45" y2="-110"/>
    </g>
    <g stroke-opacity="0.55">
      <line x1="0" y1="200" x2="0" y2="80"/>
      <line x1="-30" y1="195" x2="-12" y2="85"/>
      <line x1="30" y1="195" x2="12" y2="85"/>
      <line x1="-58" y1="185" x2="-24" y2="92"/>
      <line x1="58" y1="185" x2="24" y2="92"/>
      <line x1="-85" y1="170" x2="-35" y2="100"/>
      <line x1="85" y1="170" x2="35" y2="100"/>
    </g>
    <path d="M -140 -60 A 150 150 0 0 1 -60 -140" stroke-opacity="0.65"/>
    <path d="M 60 -140 A 150 150 0 0 1 140 -60" stroke-opacity="0.65"/>
    <path d="M 140 60 A 150 150 0 0 1 60 140" stroke-opacity="0.65"/>
    <path d="M -60 140 A 150 150 0 0 1 -140 60" stroke-opacity="0.65"/>
    <text x="-95" y="-95" fill="#999" font-family="Arial, sans-serif" font-size="11">20</text>
    <text x="88" y="-95" fill="#999" font-family="Arial, sans-serif" font-size="11">30</text>
    <text x="115" y="20" fill="#999" font-family="Arial, sans-serif" font-size="11">35</text>
    <text x="-130" y="20" fill="#999" font-family="Arial, sans-serif" font-size="11">45</text>
  </g>

  <g fill="#888" font-family="Arial, sans-serif" font-size="10">
    <text x="160" y="305">300</text>
    <text x="620" y="305" text-anchor="end">50</text>
  </g>

  <rect x="120" y="268" width="560" height="64" fill="#000" rx="2"/>
  <rect x="120" y="268" width="560" height="64" fill="none" stroke="#444" stroke-width="1" rx="2"/>
  <text x="400" y="310" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" letter-spacing="6">PLEASE STAND BY</text>
</svg>
