# leaders.sporttech.sk.ru — HTTPS-редirect (активируется скриптом enable-leaders-sk-ssl.sh)
# Не включать вручную до выпуска сертификата Let's Encrypt.

server {
    listen 443 ssl http2;
    server_name leaders.sporttech.sk.ru;

    ssl_certificate     /etc/letsencrypt/live/leaders.sporttech.sk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leaders.sporttech.sk.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://leaders-awards-st-sk-2026.gosymbol.ru$request_uri;
}
