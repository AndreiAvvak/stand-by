# leaders-awards-st-sk-2026.gosymbol.ru → GitHub Pages stand-by
# leaders.sporttech.sk.ru — CNAME на gosymbol-домен (SSL добавить после делегирования DNS Сколково)

server {
    listen 80;
    server_name leaders-awards-st-sk-2026.gosymbol.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name leaders-awards-st-sk-2026.gosymbol.ru;

    ssl_certificate     /etc/letsencrypt/live/leaders-awards-st-sk-2026.gosymbol.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leaders-awards-st-sk-2026.gosymbol.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/leaders-standby-access.log;
    error_log  /var/log/nginx/leaders-standby-error.log;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass https://andreiavvak.github.io/stand-by/;
        proxy_ssl_server_name on;
        proxy_ssl_name andreiavvak.github.io;
        proxy_set_header Host andreiavvak.github.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host leaders-awards-st-sk-2026.gosymbol.ru;

        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
    }
}

# HTTP-редirect для leaders.sporttech.sk.ru
# HTTPS vhost: scripts/enable-leaders-sk-ssl.sh (cron на RP, после DNS от Сколково)
server {
    listen 80;
    server_name leaders.sporttech.sk.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://leaders-awards-st-sk-2026.gosymbol.ru$request_uri;
    }
}
